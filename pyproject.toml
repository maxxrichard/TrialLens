[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triallens"
version = "1.4.0"
description = "Governed clinical & omics data products: pipelines, ontology and workflow apps for cohort selection and biomarker review."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
spark = ["pyspark==3.5.3"]
dev = ["pyspark==3.5.3", "pytest>=8.0", "ruff==0.6.9"]

[project.scripts]
triallens-local = "triallens.local.cli:main"

[tool.setuptools]
package-dir = { "" = "transforms-python/src" }

[tool.setuptools.packages.find]
where = ["transforms-python/src"]

[tool.setuptools.package-data]
triallens = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["transforms-python/tests"]
markers = ["e2e: end-to-end run of the full pipeline on synthetic data (slow, needs Spark)"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["functions-typescript"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B008"]
