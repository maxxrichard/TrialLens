name: Release

# Tag vX.Y.Z on main to cut a release. The bundle is what gets promoted into Foundry:
# transforms repository, ontology definitions, functions and app specs, with the
# changelog section as release notes. Promotion itself (dev -> staging -> production
# Foundry branches) is described in docs/release-management.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify version matches tag
        run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${VERSION}" = "${GITHUB_REF_NAME}" || { echo "pyproject version v${VERSION} != tag ${GITHUB_REF_NAME}"; exit 1; }
      - name: Full test suite
        run: |
          python -m pip install -e ".[dev]"
          ruff check .
          python tools/validate_specs.py
          pytest
      - name: Build release bundle
        run: |
          mkdir -p dist/bundle
          cp -r transforms-python ontology markings workshop quiver aip-logic pipeline-builder sql dist/bundle/
          cp -r ontology dist/bundle/transforms-python/ontology
          rsync -a --exclude node_modules functions-typescript dist/bundle/
          tar -czf "dist/triallens-${GITHUB_REF_NAME}.tar.gz" -C dist/bundle .
      - name: Extract release notes
        run: |
          awk -v tag="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" tag "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > dist/notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/triallens-*.tar.gz
          body_path: dist/notes.md
